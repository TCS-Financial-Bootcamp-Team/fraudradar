# ============================================================
# FRAUDRADAR - ORACLE CLOUD
# Docker Compose de producao
#
# Utilizar com:
# docker compose -f infra/docker-compose.yml \
#   -f infra/docker-compose.prod.yml ...
#
# NAO armazenar credenciais neste arquivo.
# ============================================================

services:

  db:
    # Remove completamente a publicacao da porta 5432.
    # A API acessa o banco pela rede interna do Compose.
    ports: !override []

    environment:
      POSTGRES_USER: fraudradar
      POSTGRES_DB: fraudradar
      POSTGRES_PASSWORD: ${FRAUDRADAR_DB_PASSWORD:?FRAUDRADAR_DB_PASSWORD obrigatoria}

    restart: unless-stopped

  api:
    # Disponivel apenas no loopback do servidor.
    # Posteriormente um proxy HTTPS encaminhara as requisicoes.
    ports: !override
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: "postgresql+psycopg://fraudradar:${FRAUDRADAR_DB_PASSWORD:?FRAUDRADAR_DB_PASSWORD obrigatoria}@db:5432/fraudradar"
      SUPABASE_URL: "${FRAUDRADAR_SUPABASE_URL:-}"
      AUTH_DISABLED: "false"

    restart: unless-stopped

  worker:
    environment:
      DATABASE_URL: "postgresql+psycopg://fraudradar:${FRAUDRADAR_DB_PASSWORD:?FRAUDRADAR_DB_PASSWORD obrigatoria}@db:5432/fraudradar"

    restart: unless-stopped

  worker-serve:
    # Mesma DATABASE_URL do banco de producao para atender public.jobs e agendamentos.
    environment:
      DATABASE_URL: "postgresql+psycopg://fraudradar:${FRAUDRADAR_DB_PASSWORD:?FRAUDRADAR_DB_PASSWORD obrigatoria}@db:5432/fraudradar"

    restart: unless-stopped

  web:
    # Frontend sera hospedado separadamente na Vercel.
    # Mantido apenas para execucao local explicita.
    profiles:
      - frontend-local

    ports: !override []