[project]
name = "fraudradar"
version = "0.1.0"
description = "FraudRadar PLD — monitoramento antilavagem sobre o SAML-D"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "cryptography>=43",  # Fernet das senhas de conexões externas (API e worker)
]

[dependency-groups]
api = [
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.7",  # eval_X / eval_y no fit (o treino em src/fraudradar/model usa)
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "networkx>=3.3",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]
ai = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-postgres>=0.0.12",
    "sentence-transformers>=3.0",
    # declarado só para forçar a build CPU (ver tool.uv.sources)
    "torch>=2.4",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudradar", "api", "worker"]
exclude = ["Dockerfile"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "notebooks/.ipynb_checkpoints", "lab", "laboratorio"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["fraudradar", "api", "worker"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
